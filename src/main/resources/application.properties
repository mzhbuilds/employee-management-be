spring.application.name=employee-management-be
server.port=8080

# H2 file database (data survives restarts). Use jdbc:h2:mem:employeedb for in-memory.
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Create the table from the entity on startup (schema.sql shows the equivalent DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
